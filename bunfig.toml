# Configuração do Bun

[test]
# Cobertura (ativada com "bun test --coverage", ou "bun run test:coverage"):
# o comando falha se algum arquivo ficar abaixo de 80% de linhas ou de funções
coverageThreshold = { lines = 0.8, functions = 0.8 }
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
