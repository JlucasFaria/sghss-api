name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  DATABASE_URL: postgresql://sghss:sghss@localhost:5432/sghss_test
  NODE_ENV: test
  # Segredo fictício, usado só no CI
  JWT_SECRET: segredo-de-teste-do-ci-com-mais-de-32-caracteres

jobs:
  qualidade:
    name: Lint, formatação e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Prettier
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

  testes:
    name: Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sghss_test
          POSTGRES_USER: sghss
          POSTGRES_PASSWORD: sghss
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Aplicar migrations
        run: bun run db:deploy

      - name: Testes
        run: bun test
