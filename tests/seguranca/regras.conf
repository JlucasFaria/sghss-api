# Regras da varredura do OWASP ZAP (zap-api-scan.py -c regras.conf)
# Formato: id<TAB>ação<TAB>(nome). Ações: IGNORE, INFO, WARN (padrão) ou FAIL.
# Regras não listadas aqui ficam como WARN: qualquer alerta novo faz a varredura falhar
# e precisa ser corrigido ou justificado neste arquivo.
#
# 10098: em desenvolvimento a API aceita qualquer origem (CORS_ORIGIN="*", padrão do
# .env). Em produção o valor "*" é recusado na inicialização (src/config/env.ts), e as
# origens permitidas precisam ser listadas; por isso o alerta fica só como informativo.
10098	INFO	(Cross-Domain Misconfiguration)
